// Netweir: start Firefox remote control without marking it automated
pref("remote.experimental.dynamicstart.enabled", true);
pref("remote.experimental.dynamicstart.prompt.enabled", false);
pref("browser.dom.window.dump.enabled", true);
pref("remote.experimental.dynamicstart.banner.enabled", false);
pref("remote.experimental.dynamicstart.connectionbanner.enabled", false);
try {
  const report = (label) => { for (const w of Services.wm.getEnumerator("navigator:browser")) for (const t of w.gBrowser.tabs) dump(`NETWEIR ${label} ctx=${t.userContextId} selected=${t.selected} active=${t.linkedBrowser?.docShellIsActive}\n`); };
  const start = () => {
    const { ContextualIdentityService } = ChromeUtils.importESModule("moz-src:///toolkit/components/contextualidentity/ContextualIdentityService.sys.mjs");
    const name = "remote-control-container";
    let id = ContextualIdentityService.getPublicIdentities().find(i => i.name == name);
    if (!id) id = ContextualIdentityService.create(name, "circle", "red");
    const win = Services.wm.getMostRecentBrowserWindow();
    const gb = win.gBrowser;
    const [x, y, w, h] = [win.screenX, win.screenY, win.outerWidth, win.outerHeight];
    win.openTrustedLinkIn("about:blank", "window", { userContextId: id.userContextId });
    win.setTimeout(() => {
      const wins = [...Services.wm.getEnumerator("navigator:browser")];
      dump("NETWEIR windows=" + wins.length + "\n");
      for (const nw of wins) if (nw !== win) { nw.moveTo(x, y); nw.resizeTo(w, h); }
      if (wins.length > 1) win.close();
      ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs").setTimeout(() => {
        report("after");
        const { RemoteAgent } = ChromeUtils.importESModule("chrome://remote/content/components/RemoteAgent.sys.mjs");
        RemoteAgent.startAtRuntime({ isBrowserAutomation: false }).catch(e => dump("NETWEIR start " + e + "\n"));
      }, 1500);
    }, 1500);
  };
  Services.obs.addObserver(function obs() {
    Services.obs.removeObserver(obs, "browser-idle-startup-tasks-finished");
    try { start(); } catch (e) { dump("NETWEIR " + e + "\n" + e.stack + "\n"); }
  }, "browser-idle-startup-tasks-finished");
} catch (e) {}
