name: chrome-stall-probe

on:
  push:
    branches: [probe/macos-chrome-stall]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        workers: [4]
        spotlight: [on]
        copy: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      NETWEIR_CHROME_ARGS: --disable-gpu
      RUSTFLAGS: --cfg pyo3_disable_reference_pool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - if: matrix.spotlight == 'off'
        run: sudo mdutil -a -i off
      - run: uv sync --group dev
      - run: uv run maturin develop --uv --release
      - run: uv run netweir install chrome
        timeout-minutes: 10
      - name: Open browsers and pages for 25 minutes
        run: |
          mkdir -p stalls
          uptime
          pids=""
          for w in $(seq ${{ matrix.workers }}); do
            uv run python .github/probe/stall.py stalls $w 1500 &
            pids="$pids $!"
          done
          while sleep 60; do uptime; done &
          wait $pids
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stalls-w${{ matrix.workers }}-spotlight-${{ matrix.spotlight }}-${{ matrix.copy }}
          path: stalls
          if-no-files-found: ignore
