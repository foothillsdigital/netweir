[package]
name = "netweir-core"
description = "netweir's fetching engine: browser-identical HTTP requests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
brotli = "9"
netweir-browser = { path = "../netweir-browser" }
netweir-dom = { path = "../netweir-dom" }
btls = "0.5.6"
bytes = "1"
chardetng = "1"
data-encoding = "2"
encoding_rs = "0.8"
flate2 = "1"
http = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "1"
url = "2"
wreq-proto = { version = "0.2.6", default-features = false }
# wreq's own, for a connector layer: its Layer and Service traits alone.
tower = { version = "0.5.3", default-features = false }
wreq = { version = "0.16.1", default-features = false, features = ["chromium-roots", "tokio-rt", "gzip", "brotli", "zstd", "deflate", "cookies"] }
zstd = "0.14"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
psl = "2.1"
cookie = "0.18"
http-body-util = "0.1"
# The shared queue.
# Known limit: plain TCP only. netweir's TLS is BoringSSL, and a second
# TLS stack for this alone isn't worth it yet.
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
netweir-fingerprint = { path = "../netweir-fingerprint" }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
